name: Feature Request
description: Suggest an idea for the nf-core/consepopgen pipeline
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement / User Story
      description: What problem is this feature trying to solve? Please describe it from a user's perspective.
      placeholder: "As a [type of user], I want to [perform some action] so that [I can achieve some goal]."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen. How would this feature work?
      placeholder: "[Software pixy] is a dedicated tool for [estimating population genetic statistics], it'll be nice to integrate [pixy]."
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the specific, testable outcomes that must be met for this feature to be considered complete.
      placeholder: |
        - [ ] A new module [pixy] has been added.
        - [ ] [pixy] has been integrated to main.nf.
        - [ ] Documentation has been updated to include [pixy].
  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Approach / Notes
      description: Do you have suggestions on the technical implementation? e.g., specific files to modify, libraries to use, or API endpoints to call.
      placeholder: |
        - Container could use [`community.wave.seqera.io/library/htslib_pixy:aad49e1012bf9d94`].
        - Input [population file] should generated from [samplesheet].
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: |
       - [VCFtools] can [calculate π and Fst], but [it ignores monomorphic sites], which leads to [inaccurate and systematically inflated estimates of π].
